[Mark Current Boot -> Battery]
;hold=true
set-ini-val ./config.ini State profile BATTERY
notify-now 'Current boot marked as BATTERY.'


[Mark Current Boot -> OC Mode]
;hold=true
set-ini-val ./config.ini State profile PERFORMANCE
notify-now 'Current boot marked as OC Mode.'




[Check Files]
;hold=true
;progress=true
logging

try:
path_exists ./Battery/config.ini
notify 'Battery App Profile: OK'

try:
!path_exists ./Battery/config.ini
notify 'Battery App Profile: MISSING'

try:
path_exists ./Battery/hoc.kip
notify 'Battery Horizon Profile: OK'

try:
!path_exists ./Battery/hoc.kip
notify 'Battery Horizon Profile: MISSING'

try:
path_exists ./OCMode/config.ini
notify 'OC Mode App Profile: OK'

try:
!path_exists ./OCMode/config.ini
notify 'OC Mode App Profile: MISSING'

try:
path_exists ./OCMode/hoc.kip
notify-now 'OC Mode Horizon Profile: OK'

try:
!path_exists ./OCMode/hoc.kip
notify-now 'OC Mode Horizon Profile: MISSING'

try:
path_exists ./Battery/config.ini
path_exists ./Battery/hoc.kip
path_exists ./OCMode/config.ini
path_exists ./OCMode/hoc.kip
notify-now 'All 4 core profile files: OK'

[Backup Files]

[Create Safety Backup]
;hold=true
;progress=true
logging

mkdir ./Backup
mkdir ./Backup/Active
mkdir ./Backup/Battery
mkdir ./Backup/OCMode

; Active Horizon config
try:
path_exists /config/horizon-oc/config.ini
copy /config/horizon-oc/config.ini ./Backup/Active/config.ini

; Active HOC KIP
try:
path_exists /atmosphere/kips/hoc.kip
copy /atmosphere/kips/hoc.kip ./Backup/Active/hoc.kip

; Active ReverseNX-RT
try:
path_exists /SaltySD/plugins/ReverseNX-RT
copy /SaltySD/plugins/ReverseNX-RT ./Backup/Active/ReverseNX-RT

; Stored Battery profile
try:
path_exists ./Battery/config.ini
copy ./Battery/config.ini ./Backup/Battery/config.ini

try:
path_exists ./Battery/hoc.kip
copy ./Battery/hoc.kip ./Backup/Battery/hoc.kip

try:
path_exists ./Battery/ReverseNX-RT
copy ./Battery/ReverseNX-RT ./Backup/Battery/ReverseNX-RT

; Stored OC Mode profile
try:
path_exists ./OCMode/config.ini
copy ./OCMode/config.ini ./Backup/OCMode/config.ini

try:
path_exists ./OCMode/hoc.kip
copy ./OCMode/hoc.kip ./Backup/OCMode/hoc.kip

try:
path_exists ./OCMode/ReverseNX-RT
copy ./OCMode/ReverseNX-RT ./Backup/OCMode/ReverseNX-RT

; Package state / current profile
try:
path_exists ./config.ini
copy ./config.ini ./Backup/package_state.ini

notify-now 'Safety Backup created.'


[Restore Safety Backup]
;hold=true
;progress=true
logging

; Restore stored profile files first
try:
path_exists ./Backup/Battery/config.ini
copy ./Backup/Battery/config.ini ./Battery/config.ini

try:
path_exists ./Backup/Battery/hoc.kip
copy ./Backup/Battery/hoc.kip ./Battery/hoc.kip

try:
path_exists ./Backup/Battery/ReverseNX-RT
copy ./Backup/Battery/ReverseNX-RT ./Battery/ReverseNX-RT

try:
path_exists ./Backup/OCMode/config.ini
copy ./Backup/OCMode/config.ini ./OCMode/config.ini

try:
path_exists ./Backup/OCMode/hoc.kip
copy ./Backup/OCMode/hoc.kip ./OCMode/hoc.kip

try:
path_exists ./Backup/OCMode/ReverseNX-RT
copy ./Backup/OCMode/ReverseNX-RT ./OCMode/ReverseNX-RT

; Restore active Horizon files
try:
path_exists ./Backup/Active/config.ini
copy ./Backup/Active/config.ini /config/horizon-oc/config.ini

try:
path_exists ./Backup/Active/hoc.kip
copy ./Backup/Active/hoc.kip /atmosphere/kips/

try:
path_exists ./Backup/Active/ReverseNX-RT
copy ./Backup/Active/ReverseNX-RT /SaltySD/plugins/ReverseNX-RT

; Restore package state last
try:
path_exists ./Backup/package_state.ini
copy ./Backup/package_state.ini ./config.ini

notify-now 'Safety Backup restored. Rebooting CFW.'
reboot System


