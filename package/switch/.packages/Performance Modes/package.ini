;title='Performance Modes'
;display_title='Performance Modes'
;version=1.0
;creator='retrotendo'
;about='Battery and Performance profile switching for Horizon OC.'
;credits='Ultrahand Overlay | Horizon OC | ReverseNX-RT'
;show_widget=true
;show_version=true

[@Main]

[Current Profile]
;mode=table
;alignment=left
ini_file ./config.ini
'Profile'='{ini_file(State,profile)}'


[Change Profile]

[Battery Mode]
;hold=true
;progress=true
logging

; Only a confirmed PERFORMANCE state is allowed to save/replace profiles.
; Unknown/UNSET states never overwrite a stored profile.
try:
matching_ini_val ./config.ini State profile PERFORMANCE
path_exists /config/horizon-oc/config.ini
path_exists /atmosphere/kips/hoc.kip
path_exists ./Battery/config.ini
path_exists ./Battery/hoc.kip
mkdir ./Performance
copy /config/horizon-oc/config.ini ./Performance/config.ini
copy /atmosphere/kips/hoc.kip ./Performance/

; Optional ReverseNX-RT per-title settings are silently stored with the mode.
try:
matching_ini_val ./config.ini State profile PERFORMANCE
path_exists /SaltySD/plugins/ReverseNX-RT
path_exists ./Performance/ReverseNX-RT
delete ./Performance/ReverseNX-RT

try:
matching_ini_val ./config.ini State profile PERFORMANCE
path_exists /SaltySD/plugins/ReverseNX-RT
mkdir ./Performance/ReverseNX-RT
copy /SaltySD/plugins/ReverseNX-RT/*.dat ./Performance/ReverseNX-RT/

; Restore Battery ReverseNX-RT per-title settings only when ReverseNX-RT exists.
try:
matching_ini_val ./config.ini State profile PERFORMANCE
path_exists /SaltySD/plugins/ReverseNX-RT
path_exists ./Battery/ReverseNX-RT
delete /SaltySD/plugins/ReverseNX-RT/*.dat

try:
matching_ini_val ./config.ini State profile PERFORMANCE
path_exists /SaltySD/plugins/ReverseNX-RT
path_exists ./Battery/ReverseNX-RT
copy ./Battery/ReverseNX-RT/*.dat /SaltySD/plugins/ReverseNX-RT/

; Load Battery Horizon config + HOC KIP and reboot.
try:
matching_ini_val ./config.ini State profile PERFORMANCE
path_exists ./Battery/config.ini
path_exists ./Battery/hoc.kip
copy ./Battery/config.ini /config/horizon-oc/config.ini
copy ./Battery/hoc.kip /atmosphere/kips/
set-ini-val ./config.ini State profile BATTERY
notify-now 'Battery Mode loaded. Rebooting CFW.'
reboot

try:
matching_ini_val ./config.ini State profile BATTERY
notify-now 'Battery Mode is already active.'

try:
!matching_ini_val ./config.ini State profile PERFORMANCE
!matching_ini_val ./config.ini State profile BATTERY
notify-now 'Unknown profile state. Nothing changed. Use Setup first.'


[Performance Mode]
;hold=true
;progress=true
logging

; Only a confirmed BATTERY state is allowed to save/replace profiles.
; Unknown/UNSET states never overwrite a stored profile.
try:
matching_ini_val ./config.ini State profile BATTERY
path_exists /config/horizon-oc/config.ini
path_exists /atmosphere/kips/hoc.kip
path_exists ./Performance/config.ini
path_exists ./Performance/hoc.kip
mkdir ./Battery
copy /config/horizon-oc/config.ini ./Battery/config.ini
copy /atmosphere/kips/hoc.kip ./Battery/

; Optional ReverseNX-RT per-title settings are silently stored with the mode.
try:
matching_ini_val ./config.ini State profile BATTERY
path_exists /SaltySD/plugins/ReverseNX-RT
path_exists ./Battery/ReverseNX-RT
delete ./Battery/ReverseNX-RT

try:
matching_ini_val ./config.ini State profile BATTERY
path_exists /SaltySD/plugins/ReverseNX-RT
mkdir ./Battery/ReverseNX-RT
copy /SaltySD/plugins/ReverseNX-RT/*.dat ./Battery/ReverseNX-RT/

; Restore Performance ReverseNX-RT per-title settings only when ReverseNX-RT exists.
try:
matching_ini_val ./config.ini State profile BATTERY
path_exists /SaltySD/plugins/ReverseNX-RT
path_exists ./Performance/ReverseNX-RT
delete /SaltySD/plugins/ReverseNX-RT/*.dat

try:
matching_ini_val ./config.ini State profile BATTERY
path_exists /SaltySD/plugins/ReverseNX-RT
path_exists ./Performance/ReverseNX-RT
copy ./Performance/ReverseNX-RT/*.dat /SaltySD/plugins/ReverseNX-RT/

; Load Performance Horizon config + HOC KIP and reboot.
try:
matching_ini_val ./config.ini State profile BATTERY
path_exists ./Performance/config.ini
path_exists ./Performance/hoc.kip
copy ./Performance/config.ini /config/horizon-oc/config.ini
copy ./Performance/hoc.kip /atmosphere/kips/
set-ini-val ./config.ini State profile PERFORMANCE
notify-now 'Performance Mode loaded. Rebooting CFW.'
reboot

try:
matching_ini_val ./config.ini State profile PERFORMANCE
notify-now 'Performance Mode is already active.'

try:
!matching_ini_val ./config.ini State profile PERFORMANCE
!matching_ini_val ./config.ini State profile BATTERY
notify-now 'Unknown profile state. Nothing changed. Use Setup first.'


[Save Settings]

[as Battery Mode]
;hold=true
;progress=true
logging

mkdir ./Battery

try:
path_exists /config/horizon-oc/config.ini
path_exists /atmosphere/kips/hoc.kip
copy /config/horizon-oc/config.ini ./Battery/config.ini
copy /atmosphere/kips/hoc.kip ./Battery/

; ReverseNX-RT is optional and intentionally not mentioned in the UI.
try:
path_exists /SaltySD/plugins/ReverseNX-RT
path_exists ./Battery/ReverseNX-RT
delete ./Battery/ReverseNX-RT

try:
path_exists /SaltySD/plugins/ReverseNX-RT
mkdir ./Battery/ReverseNX-RT
copy /SaltySD/plugins/ReverseNX-RT/*.dat ./Battery/ReverseNX-RT/

notify-now 'Settings saved as Battery Mode.'


[as Performance Mode]
;hold=true
;progress=true
logging

mkdir ./Performance

try:
path_exists /config/horizon-oc/config.ini
path_exists /atmosphere/kips/hoc.kip
copy /config/horizon-oc/config.ini ./Performance/config.ini
copy /atmosphere/kips/hoc.kip ./Performance/

; ReverseNX-RT is optional and intentionally not mentioned in the UI.
try:
path_exists /SaltySD/plugins/ReverseNX-RT
path_exists ./Performance/ReverseNX-RT
delete ./Performance/ReverseNX-RT

try:
path_exists /SaltySD/plugins/ReverseNX-RT
mkdir ./Performance/ReverseNX-RT
copy /SaltySD/plugins/ReverseNX-RT/*.dat ./Performance/ReverseNX-RT/

notify-now 'Settings saved as Performance Mode.'


[@Setup]

[Initial Setup]

[Reset Battery App Profiles -> STOCK]
;hold=true
;progress=true
logging

; Safety rule: only edit the stored Battery profile while PERFORMANCE is active.
; Remove the standard per-title clock keys from every section while preserving
; the complete Horizon OC [values] section and any unrelated settings.
try:
matching_ini_val ./config.ini State profile PERFORMANCE
path_exists ./Battery/config.ini
remove-ini-key-matching-key ./Battery/config.ini docked_cpu docked_cpu
remove-ini-key-matching-key ./Battery/config.ini docked_gpu docked_gpu
remove-ini-key-matching-key ./Battery/config.ini docked_mem docked_mem
remove-ini-key-matching-key ./Battery/config.ini handheld_cpu handheld_cpu
remove-ini-key-matching-key ./Battery/config.ini handheld_gpu handheld_gpu
remove-ini-key-matching-key ./Battery/config.ini handheld_mem handheld_mem
remove-ini-key-matching-key ./Battery/config.ini handheld_charging_cpu handheld_charging_cpu
remove-ini-key-matching-key ./Battery/config.ini handheld_charging_gpu handheld_charging_gpu
remove-ini-key-matching-key ./Battery/config.ini handheld_charging_mem handheld_charging_mem
remove-ini-key-matching-key ./Battery/config.ini handheld_charging_usb_cpu handheld_charging_usb_cpu
remove-ini-key-matching-key ./Battery/config.ini handheld_charging_usb_gpu handheld_charging_usb_gpu
remove-ini-key-matching-key ./Battery/config.ini handheld_charging_usb_mem handheld_charging_usb_mem
remove-ini-key-matching-key ./Battery/config.ini handheld_charging_official_cpu handheld_charging_official_cpu
remove-ini-key-matching-key ./Battery/config.ini handheld_charging_official_gpu handheld_charging_official_gpu
remove-ini-key-matching-key ./Battery/config.ini handheld_charging_official_mem handheld_charging_official_mem
notify-now 'Battery app profiles reset to STOCK.'

; ReverseNX-RT per-title overrides belong to the app profile as well.
try:
matching_ini_val ./config.ini State profile PERFORMANCE
path_exists ./Battery/ReverseNX-RT
delete ./Battery/ReverseNX-RT

try:
matching_ini_val ./config.ini State profile BATTERY
notify-now 'Only possible in Performance Mode. Nothing changed.'

try:
!matching_ini_val ./config.ini State profile PERFORMANCE
!matching_ini_val ./config.ini State profile BATTERY
notify-now 'Unknown profile state. Nothing changed.'


[Mark Current Boot -> Battery]
;hold=true
set-ini-val ./config.ini State profile BATTERY
notify-now 'Current boot marked as BATTERY.'


[Mark Current Boot -> Performance]
;hold=true
set-ini-val ./config.ini State profile PERFORMANCE
notify-now 'Current boot marked as PERFORMANCE.'


[Check Files]
;hold=true
;progress=true
logging

try:
path_exists ./Battery/config.ini
notify 'Battery config.ini: OK'

try:
!path_exists ./Battery/config.ini
notify 'Battery config.ini: MISSING'

try:
path_exists ./Battery/hoc.kip
notify 'Battery hoc.kip: OK'

try:
!path_exists ./Battery/hoc.kip
notify 'Battery hoc.kip: MISSING'

try:
path_exists ./Performance/config.ini
notify 'Performance config.ini: OK'

try:
!path_exists ./Performance/config.ini
notify 'Performance config.ini: MISSING'

try:
path_exists ./Performance/hoc.kip
notify-now 'Performance hoc.kip: OK'

try:
!path_exists ./Performance/hoc.kip
notify-now 'Performance hoc.kip: MISSING'


[Backup Files]

[Create Safety Backup]
;hold=true
;progress=true
logging

; A Safety Backup is manual and only replaced when this command is run.
try:
path_exists ./Backup
delete ./Backup

mkdir ./Backup
mkdir ./Backup/Active
mkdir ./Backup/Battery
mkdir ./Backup/Performance

try:
path_exists /config/horizon-oc/config.ini
copy /config/horizon-oc/config.ini ./Backup/Active/config.ini

try:
path_exists /atmosphere/kips/hoc.kip
copy /atmosphere/kips/hoc.kip ./Backup/Active/hoc.kip

try:
path_exists ./Battery/config.ini
copy ./Battery/config.ini ./Backup/Battery/config.ini

try:
path_exists ./Battery/hoc.kip
copy ./Battery/hoc.kip ./Backup/Battery/hoc.kip

try:
path_exists ./Performance/config.ini
copy ./Performance/config.ini ./Backup/Performance/config.ini

try:
path_exists ./Performance/hoc.kip
copy ./Performance/hoc.kip ./Backup/Performance/hoc.kip

try:
path_exists ./Battery/ReverseNX-RT
mkdir ./Backup/Battery/ReverseNX-RT
copy ./Battery/ReverseNX-RT/*.dat ./Backup/Battery/ReverseNX-RT/

try:
path_exists ./Performance/ReverseNX-RT
mkdir ./Backup/Performance/ReverseNX-RT
copy ./Performance/ReverseNX-RT/*.dat ./Backup/Performance/ReverseNX-RT/

try:
path_exists /SaltySD/plugins/ReverseNX-RT
mkdir ./Backup/Active/ReverseNX-RT
copy /SaltySD/plugins/ReverseNX-RT/*.dat ./Backup/Active/ReverseNX-RT/

try:
path_exists ./config.ini
copy ./config.ini ./Backup/package_state.ini

notify-now 'Safety Backup created.'


[Restore Safety Backup]
;hold=true
;progress=true
logging

; Restore stored Battery profile.
try:
path_exists ./Backup/Battery/config.ini
copy ./Backup/Battery/config.ini ./Battery/config.ini

try:
path_exists ./Backup/Battery/hoc.kip
copy ./Backup/Battery/hoc.kip ./Battery/hoc.kip

try:
path_exists ./Backup/Battery/ReverseNX-RT
path_exists ./Battery/ReverseNX-RT
delete ./Battery/ReverseNX-RT

try:
path_exists ./Backup/Battery/ReverseNX-RT
mkdir ./Battery/ReverseNX-RT
copy ./Backup/Battery/ReverseNX-RT/*.dat ./Battery/ReverseNX-RT/

; Restore stored Performance profile.
try:
path_exists ./Backup/Performance/config.ini
copy ./Backup/Performance/config.ini ./Performance/config.ini

try:
path_exists ./Backup/Performance/hoc.kip
copy ./Backup/Performance/hoc.kip ./Performance/hoc.kip

try:
path_exists ./Backup/Performance/ReverseNX-RT
path_exists ./Performance/ReverseNX-RT
delete ./Performance/ReverseNX-RT

try:
path_exists ./Backup/Performance/ReverseNX-RT
mkdir ./Performance/ReverseNX-RT
copy ./Backup/Performance/ReverseNX-RT/*.dat ./Performance/ReverseNX-RT/

; Restore active Horizon config + KIP.
try:
path_exists ./Backup/Active/config.ini
copy ./Backup/Active/config.ini /config/horizon-oc/config.ini

try:
path_exists ./Backup/Active/hoc.kip
copy ./Backup/Active/hoc.kip /atmosphere/kips/

; Restore active ReverseNX-RT settings only if ReverseNX-RT is installed.
try:
path_exists ./Backup/Active/ReverseNX-RT
path_exists /SaltySD/plugins/ReverseNX-RT
delete /SaltySD/plugins/ReverseNX-RT/*.dat

try:
path_exists ./Backup/Active/ReverseNX-RT
path_exists /SaltySD/plugins/ReverseNX-RT
copy ./Backup/Active/ReverseNX-RT/*.dat /SaltySD/plugins/ReverseNX-RT/

; Restore state last, then reboot into the restored active files.
try:
path_exists ./Backup/package_state.ini
copy ./Backup/package_state.ini ./config.ini

notify-now 'Safety Backup restored. Rebooting CFW.'
reboot
