;title='Performance Modes'
;display_title='Performance Modes'
;version=1.0
;creator='retrotendo'
;about='Battery / OC profiles for Horizon OC with automatic app settings.'
;credits='Ultrahand Overlay | Horizon OC | ReverseNX-RT'
;show_widget=true
;show_version=true

[@Main]

[Current Profile]
;mode=table
;alignment=left
ini_file ./config.ini
'Profile'='{ini_file(State,profile)}'


[Change Profile]

[Battery Mode]
;hold=true
;progress=true
logging

; OC Mode -> BATTERY
; Auto-save BOTH outgoing App Profile (full Horizon config)
; and outgoing Horizon/HOC Profile (hoc.kip).
try:
matching_ini_val ./config.ini State profile PERFORMANCE
path_exists /config/horizon-oc/config.ini
path_exists /atmosphere/kips/hoc.kip
path_exists ./Battery/config.ini
path_exists ./Battery/hoc.kip
mkdir ./OCMode
copy /config/horizon-oc/config.ini ./OCMode/config.ini
copy /atmosphere/kips/hoc.kip ./OCMode/
mkdir ./OCMode/ReverseNX-RT
mkdir ./Battery/ReverseNX-RT
mkdir /SaltySD/plugins/ReverseNX-RT
copy /SaltySD/plugins/ReverseNX-RT ./OCMode/ReverseNX-RT
copy ./Battery/ReverseNX-RT /SaltySD/plugins/ReverseNX-RT
copy ./Battery/config.ini /config/horizon-oc/config.ini
copy ./Battery/hoc.kip /atmosphere/kips/
set-ini-val ./config.ini State profile BATTERY
notify-now 'Battery profile loaded. Rebooting CFW.'
reboot System

try:
matching_ini_val ./config.ini State profile BATTERY
notify-now 'Battery is already the current profile.'

try:
matching_ini_val ./config.ini State profile UNSET
notify-now 'Current Profile is UNSET. Use Initial Setup first.'


[OC Mode]
;hold=true
;progress=true
logging

; BATTERY -> OC Mode
; Auto-save BOTH outgoing App Profile (full Horizon config)
; and outgoing Horizon/HOC Profile (hoc.kip).
try:
matching_ini_val ./config.ini State profile BATTERY
path_exists /config/horizon-oc/config.ini
path_exists /atmosphere/kips/hoc.kip
path_exists ./OCMode/config.ini
path_exists ./OCMode/hoc.kip
mkdir ./Battery
copy /config/horizon-oc/config.ini ./Battery/config.ini
copy /atmosphere/kips/hoc.kip ./Battery/
mkdir ./Battery/ReverseNX-RT
mkdir ./OCMode/ReverseNX-RT
mkdir /SaltySD/plugins/ReverseNX-RT
copy /SaltySD/plugins/ReverseNX-RT ./Battery/ReverseNX-RT
copy ./OCMode/ReverseNX-RT /SaltySD/plugins/ReverseNX-RT
copy ./OCMode/config.ini /config/horizon-oc/config.ini
copy ./OCMode/hoc.kip /atmosphere/kips/
set-ini-val ./config.ini State profile PERFORMANCE
notify-now 'OC Mode profile loaded. Rebooting CFW.'
reboot System

try:
matching_ini_val ./config.ini State profile PERFORMANCE
notify-now 'OC Mode is already the current profile.'

try:
matching_ini_val ./config.ini State profile UNSET
notify-now 'Current Profile is UNSET. Use Initial Setup first.'


[Save Settings]

[as Battery Mode]
;hold=true
;progress=true
logging
mkdir ./Battery
try:
path_exists /config/horizon-oc/config.ini
path_exists /atmosphere/kips/hoc.kip
copy /config/horizon-oc/config.ini ./Battery/config.ini
copy /atmosphere/kips/hoc.kip ./Battery/
mkdir ./Battery/ReverseNX-RT
mkdir /SaltySD/plugins/ReverseNX-RT
copy /SaltySD/plugins/ReverseNX-RT ./Battery/ReverseNX-RT
notify-now 'Battery profile saved.'


[as OC Mode]
;hold=true
;progress=true
logging
mkdir ./OCMode
try:
path_exists /config/horizon-oc/config.ini
path_exists /atmosphere/kips/hoc.kip
copy /config/horizon-oc/config.ini ./OCMode/config.ini
copy /atmosphere/kips/hoc.kip ./OCMode/
mkdir ./OCMode/ReverseNX-RT
mkdir /SaltySD/plugins/ReverseNX-RT
copy /SaltySD/plugins/ReverseNX-RT ./OCMode/ReverseNX-RT
notify-now 'OC Mode profile saved.'


