name: One-time sync release source

on:
  push:
    paths:
      - '.github/workflows/sync-release-source.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract tested package files from release archive
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/performance-modes-release
          mkdir -p /tmp/performance-modes-release
          unzip -q 'dist/Performance-Modes-v1.0.zip' -d /tmp/performance-modes-release
          src='/tmp/performance-modes-release/switch/.packages/Performance Modes'
          dst='package/switch/.packages/Performance Modes'
          cp "$src/package.ini" "$dst/package.ini"
          cp "$src/README.txt" "$dst/README.txt"
          cp "$src/Performance/_PROFILE_FOLDER.txt" "$dst/Performance/_PROFILE_FOLDER.txt"
      - name: Commit exact release source and remove helper workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'package/switch/.packages/Performance Modes/package.ini' \
                  'package/switch/.packages/Performance Modes/README.txt' \
                  'package/switch/.packages/Performance Modes/Performance/_PROFILE_FOLDER.txt'
          git rm '.github/workflows/sync-release-source.yml'
          git commit -m 'Sync source exactly from tested v1.0 release archive'
          git push
